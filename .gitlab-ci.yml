stages:
  - tf_validate
  - tf_plan
  - tf_apply
  - build
  - deploy

variables:
  TF_ROOT: "${CI_PROJECT_DIR}/terraform"
  TF_STATE_NAME: "k8s-aws-production"
  IMAGE_TAG: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  IMAGE_LATEST: "${CI_REGISTRY_IMAGE}:latest"
  TF_HTTP_USERNAME: "gitlab-ci-token"
  TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"

default:
  image:
    name: hashicorp/terraform:1.6.6
    entrypoint: [""]

cache:
  key: "${TF_STATE_NAME}"
  paths:
    - ${TF_ROOT}/.terraform/

# -------------------------------------------------------------------
# 1. TERRAFORM VALIDATE & PLAN
# -------------------------------------------------------------------
tf_validate:
  stage: tf_validate
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p /tmp
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > /tmp/id_rsa && chmod 600 /tmp/id_rsa
    - PUBLIC_KEY=$(ssh-keygen -y -f /tmp/id_rsa)
    - echo "public_key_data = \"$PUBLIC_KEY\"" > ${TF_ROOT}/terraform.tfvars
  script:
    - cd ${TF_ROOT}
    - terraform init -reconfigure -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    - terraform validate

tf_plan:
  stage: tf_plan
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p /tmp
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > /tmp/id_rsa && chmod 600 /tmp/id_rsa
    - PUBLIC_KEY=$(ssh-keygen -y -f /tmp/id_rsa)
    - echo "public_key_data = \"$PUBLIC_KEY\"" > ${TF_ROOT}/terraform.tfvars
  script:
    - cd ${TF_ROOT}
    - terraform init -reconfigure -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
      - ${TF_ROOT}/terraform.tfvars

# -------------------------------------------------------------------
# 2. TERRAFORM APPLY (Automated & Captures Dynamic EC2 IP)
# -------------------------------------------------------------------
tf_apply:
  stage: tf_apply
  script:
    - cd ${TF_ROOT}
    - terraform init -reconfigure -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    - terraform apply -auto-approve tfplan
    - echo "EC2_PUBLIC_IP=$(terraform output -raw ec2_public_ip)" > ${CI_PROJECT_DIR}/ec2_ip.env
  artifacts:
    paths:
      - ${CI_PROJECT_DIR}/ec2_ip.env
    reports:
      dotenv: ${CI_PROJECT_DIR}/ec2_ip.env
  rules:
    - changes:
        - terraform/**/*
  only:
    - main

# -------------------------------------------------------------------
# 3. DOCKER IMAGE BUILD & PUSH TO GITLAB REGISTRY
# -------------------------------------------------------------------
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_LATEST
  only:
    - main

# -------------------------------------------------------------------
# 4. KUBERNETES DEPLOYMENT OVER SSH TUNNEL
# -------------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl helm
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_PUBLIC_IP >> ~/.ssh/known_hosts
  script:
    - mkdir -p ~/.kube
    
    # K3s initialization & health-check loop (Fixed with ssh sudo cat instead of scp)
    - echo "Waiting for K3s service to initialize on EC2..."
    - ssh ubuntu@$EC2_PUBLIC_IP "sudo cat /etc/rancher/k3s/k3s.yaml" | sed "s/127.0.0.1/$EC2_PUBLIC_IP/g" > ~/.kube/config
    
    - echo "Waiting for Kubernetes API server to accept connections..."
    - |
      until kubectl get nodes; do
        echo "API server not ready yet, retrying in 5 seconds..."
        sleep 5
      done

    - kubectl apply --validate=false -f k8s/namespace.yaml
    - kubectl apply --validate=false -f k8s/ingress.yaml
    
    - kubectl create secret generic agent-secrets \
        --namespace=job-agent \
        --from-literal=GMAIL_USER_EMAIL="$GMAIL_USER_EMAIL" \
        --from-literal=GMAIL_APP_PASSWORD="$GMAIL_APP_PASSWORD" \
        --from-literal=GROQ_API_KEY="$GROQ_API_KEY" \
        --dry-run=client -o yaml | kubectl apply -f -
        
    - kubectl apply --validate=false -f k8s/playwright-deployment.yaml
    - sed -i "s|__IMAGE_PLACEHOLDER__|${IMAGE_TAG}|g" k8s/agent-cronjob.yaml
    - kubectl apply --validate=false -f k8s/agent-cronjob.yaml
  only:
    - main