apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-headless
  namespace: job-agent
  labels:
    app: playwright-headless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright-headless
  template:
    metadata:
      labels:
        app: playwright-headless
    spec:
      containers:
      - name: playwright
        image: mcr.microsoft.com/playwright:v1.49.0-jammy
        imagePullPolicy: Always
        command:
        - npx
        - -y
        - playwright@1.49.0
        - run-server
        - --port
        - "3000"
        - --host
        - "0.0.0.0"
        - --browser
        - chromium
        args:
        - --disable-blink-features=AutomationControlled
        - --no-sandbox
        - --disable-setuid-sandbox
        - --disable-infobars
        - --window-size=1920,1080
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "150m"
            memory: "300Mi"
          limits:
            cpu: "400m"
            # 300Mi was too tight for a real LinkedIn page (job listings, images, fonts,
            # heavy JS bundle) — Chromium was likely getting OOMKilled mid-navigation,
            # which shows up client-side as a silent hang until the goto() timeout fires.
            memory: "600Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: playwright-service
  namespace: job-agent
spec:
  selector:
    app: playwright-headless
  ports:
  - port: 3000
    targetPort: 3000