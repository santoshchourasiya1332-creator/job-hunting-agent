loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  storage_config:
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v12
        index:
          prefix: index_
          period: 24h
  server:
    http_listen_port: 3100
  limits_config:
    allow_structured_metadata: false
    enforce_metric_name: false